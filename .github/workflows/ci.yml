name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  # ─── Job 1: Unit tests (sin red, sin DB real) ───────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run verification tests
        run: npm test

  # ─── Job 2: Smoke tests contra producción (solo en main) ────────────────────
  smoke:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test

    steps:
      - name: Esperar propagación de Vercel (30 s)
        run: sleep 30

      - name: "Health: /api/data devuelve status success o empty"
        run: |
          STATUS=$(curl -sf https://fag-eventos.vercel.app/api/data | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))")
          echo "api/data status: $STATUS"
          [[ "$STATUS" == "success" || "$STATUS" == "empty" ]]

      - name: "CSP: script-src solo 'self' (sin unsafe-inline)"
        run: |
          HEADER=$(curl -sI https://fag-eventos.vercel.app | tr -d '\r' | grep -i content-security-policy)
          echo "$HEADER"
          echo "$HEADER" | grep -q "script-src 'self'"
          echo "$HEADER" | grep -qv "unsafe-inline" || (echo "FAIL: unsafe-inline presente en CSP" && exit 1)

      - name: "CSP: /admin.html tiene el mismo header"
        run: |
          HEADER=$(curl -sI https://fag-eventos.vercel.app/admin.html | tr -d '\r' | grep -i content-security-policy)
          echo "$HEADER"
          echo "$HEADER" | grep -q "script-src 'self'"

      - name: "CSP Report: GET -> 405"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fag-eventos.vercel.app/api/csp-report)
          echo "GET /api/csp-report -> $STATUS"
          [ "$STATUS" = "405" ]

      - name: "CSP Report: POST -> 204"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://fag-eventos.vercel.app/api/csp-report \
            -H "Content-Type: application/csp-report" \
            -d '{"csp-report":{"document-uri":"https://fag-eventos.vercel.app/","violated-directive":"script-src","blocked-uri":"https://ci.test/evil.js"}}')
          echo "POST /api/csp-report -> $STATUS"
          [ "$STATUS" = "204" ]

      - name: "Headers: HSTS presente"
        run: |
          curl -sI https://fag-eventos.vercel.app | tr -d '\r' | grep -i strict-transport-security | grep -q "max-age"

      - name: "Headers: X-Frame-Options DENY"
        run: |
          curl -sI https://fag-eventos.vercel.app | tr -d '\r' | grep -i x-frame-options | grep -q -i "deny"

      - name: "Headers: nosniff"
        run: |
          curl -sI https://fag-eventos.vercel.app | tr -d '\r' | grep -i x-content-type-options | grep -q "nosniff"

      - name: "admin.html: Cache-Control no-store"
        run: |
          curl -sI https://fag-eventos.vercel.app/admin.html | tr -d '\r' | grep -i cache-control | grep -q "no-store"

      - name: "Session: /api/session devuelve authenticated false sin cookie"
        run: |
          BODY=$(curl -sf https://fag-eventos.vercel.app/api/session)
          echo "session body: $BODY"
          echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('authenticated')==False, 'expected false'"

      - name: "Login: POST sin credenciales no devuelve 200"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://fag-eventos.vercel.app/api/login \
            -H "Content-Type: application/json" \
            -d '{"password":"smoke-test-wrong-pw-ci"}')
          echo "login with wrong pw -> $STATUS"
          [ "$STATUS" != "200" ]
